<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint Typing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" tabindex="0" aria-label="Typing game">
      <div class="hud">
        <div id="status" class="status"></div>
        <div class="modes">
          <button id="btnAlphabet" class="pill active" type="button">Alphabet</button>
          <button id="btnFox" class="pill" type="button">Fox</button>
        </div>
      </div>

      <div class="center">
        <div class="best">Best: <span id="bestValue" class="mono">—</span></div>
        <div id="timer" class="timer mono">00:00.000</div>

        <div class="typedWrap">
          <div id="typed" class="typed mono" aria-live="polite"></div>
        </div>

        <div id="score" class="score mono"></div>
        <div id="scoreHint" class="scoreHint"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
