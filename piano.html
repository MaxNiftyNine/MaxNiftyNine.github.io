<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Piano</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    font-family: sans-serif;
  }
  .piano {
    position: relative;
    display: flex;
    background: #111;
    padding: 12px 26px 12px 12px;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .white {
    width: 56px;
    height: 220px;
    background: #fafafa;
    border: 1px solid #999;
    border-radius: 0 0 6px 6px;
    margin: 0 1px;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    padding-bottom: 10px;
    color: #555;
    cursor: pointer;
    user-select: none;
    transition: background .05s;
    font-size: 14px;
  }
  .white.active { background: #cfe9ff; }
  .black {
    position: absolute;
    width: 36px;
    height: 130px;
    background: #222;
    border-radius: 0 0 4px 4px;
    color: #ccc;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    padding-bottom: 8px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
    top: 12px;
    transition: background .05s;
  }
  .black.active { background: #4a7fa8; }
</style>
</head>
<body>
<div class="piano" id="piano"></div>
<script>
  const keys = [
    { key: 'a',  freq: 261.63, type: 'white' }, // C4
    { key: 'w',  freq: 277.18, type: 'black' }, // C#4
    { key: 's',  freq: 293.66, type: 'white' }, // D4
    { key: 'e',  freq: 311.13, type: 'black' }, // D#4
    { key: 'd',  freq: 329.63, type: 'white' }, // E4
    { key: 'f',  freq: 349.23, type: 'white' }, // F4
    { key: 't',  freq: 369.99, type: 'black' }, // F#4
    { key: 'g',  freq: 392.00, type: 'white' }, // G4
    { key: 'y',  freq: 415.30, type: 'black' }, // G#4
    { key: 'h',  freq: 440.00, type: 'white' }, // A4
    { key: 'u',  freq: 466.16, type: 'black' }, // A#4
    { key: 'j',  freq: 493.88, type: 'white' }, // B4
    { key: 'k',  freq: 523.25, type: 'white' }, // C5
    { key: 'o',  freq: 554.37, type: 'black' }, // C#5
    { key: 'l',  freq: 587.33, type: 'white' }, // D5
    { key: 'p',  freq: 622.25, type: 'black' }, // D#5
    { key: ';',  freq: 659.25, type: 'white' }, // E5
    { key: "'",  freq: 698.46, type: 'white' }, // F5
    { key: ']',  freq: 739.99, type: 'black' }  // F#5
  ];

  const piano = document.getElementById('piano');
  const elements = {};
  const WHITE_W = 58; // 56 width + 2 (1px margin each side)
  const PAD = 12;

  // Pass 1: render white keys in order
  let whiteIdx = 0;
  keys.forEach(k => {
    if (k.type === 'white') {
      const el = document.createElement('div');
      el.className = 'white';
      el.textContent = k.key;
      piano.appendChild(el);
      elements[k.key] = el;
      k._whiteIdx = whiteIdx++;
    }
  });

  // Pass 2: position black keys absolutely over the gaps between whites
  let lastWhite = -1;
  keys.forEach(k => {
    if (k.type === 'white') {
      lastWhite = k._whiteIdx;
    } else {
      const el = document.createElement('div');
      el.className = 'black';
      el.textContent = k.key;
      el.style.left = (PAD + (lastWhite + 1) * WHITE_W - 18) + 'px';
      piano.appendChild(el);
      elements[k.key] = el;
    }
  });

  // Web Audio
  let ctx;
  const active = {};

  function playNote(key) {
    const k = keys.find(x => x.key === key);
    if (!k || active[key]) return;
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = k.freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.01);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    active[key] = { osc, gain };
    elements[key].classList.add('active');
  }

  function stopNote(key) {
    if (!active[key]) return;
    const { osc, gain } = active[key];
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
    osc.stop(ctx.currentTime + 0.16);
    delete active[key];
    elements[key].classList.remove('active');
  }

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (elements[k]) { e.preventDefault(); playNote(k); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (elements[k]) stopNote(k);
  });

  // Mouse
  Object.keys(elements).forEach(key => {
    const el = elements[key];
    el.addEventListener('mousedown', () => playNote(key));
    el.addEventListener('mouseup', () => stopNote(key));
    el.addEventListener('mouseleave', () => stopNote(key));
  });
</script>
</body>
</html>
